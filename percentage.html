<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>ATTENDENCE</title> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"> 

<style>

    body {
        background-color: #bfe9ff;  
        font-family: Arial, sans-serif;
        text-align: center;
    }

    table {
        background-color: #e6f7ff;  
        margin: 20px auto;
        border-radius: 10px;
        border: 1px solid #1e90ff;
            border-collapse: collapse;
}

    th, td {
        padding: 10px 15px;
        border: 1px solid #87cefa;
    }

    th {
        background-color: #87cefa;
        color: #003366;
    }

    input {
        width: 70px;
        border-radius: 5px;
        border: 1px solid #4682b4;
        text-align: center;
    }

    button {
        background-color: #1e90ff;
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 8px 18px;
        cursor: pointer;
    }

    button:hover {
        background-color: #00bfff;
        color: #000;
    }

    h1 {
        color: #003366;
    }

    .good {
        color: green;
        font-weight: bold;
    }

    .bad {
        color: red;
        font-weight: bold;
    }

</style>

</head>

    <body>

        <h1>ATTENDANCE PERCENTAGE CALCULATOR</h1>

        <table>

            <tr>
                <th>Subject</th>
                <th>Total Classes</th>
                <th>Attended</th>
                <th>Attendance %</th>
                <th>Status</th>
                </tr>

            <tr>
                <td>MATHS</td>
                <td><input type="number" id="total_maths" value="0"></td>
                <td><input type="number" id="attended_maths" value="0"></td>
                <td id="percent_maths">0%</td>
                <td id="status_maths"></td>
            </tr>

            <tr>
                <td>PHYSICS</td>
                <td><input type="number" id="total_physics" value="0"></td>
                <td><input type="number" id="attended_physics" value="0"></td>
                <td id="percent_physics">0%</td>
                <td id="status_physics"></td>
            </tr>

            <tr>
                <td>EG</td>
                <td><input type="number" id="total_eg" value="0"></td>
                <td><input type="number" id="attended_eg" value="0"></td>
                <td id="percent_eg">0%</td>
                <td id="status_eg"></td>
            </tr>

            <tr>
                <td>DS</td>
                <td><input type="number" id="total_ds" value="0"></td>
                <td><input type="number" id="attended_ds" value="0"></td>
                <td id="percent_ds">0%</td>
                <td id="status_ds"></td>
            </tr>

            <tr>
                <td>CO</td>
                <td><input type="number" id="total_co" value="0"></td>
                <td><input type="number" id="attended_co" value="0"></td>
                <td id="percent_co">0%</td>
                <td id="status_co"></td>
            </tr>

            <tr>
                <td>DTI</td>
                <td><input type="number" id="total_dti" value="0"></td>
                <td><input type="number" id="attended_dti" value="0"></td>
                <td id="percent_dti">0%</td>
                <td id="status_dti"></td>
            </tr>

        </table> 
        <br>

    <button onclick="calculate()">Calculate Attendance</button>

    <script>

        function calculate(){

        const subjects=["maths","physics","eg","ds","co","dti"];

        subjects.forEach(sub=>{

        let total=parseInt(document.getElementById("total_"+sub).value)||0;
        let attended=parseInt(document.getElementById("attended_"+sub).value)||0;

        let percent = total===0 ? 0 : Math.round((attended/total)*100);

        let percentCell=document.getElementById("percent_"+sub);
        let statusCell=document.getElementById("status_"+sub);

        percentCell.innerText=percent+"%";

        if(percent>=75){

        percentCell.className="good";

        let skip=Math.floor((attended/0.75)-total);

        statusCell.innerText="Can skip "+skip+" classes";
        statusCell.className="good";

        }else{

        percentCell.className="bad";

        let need=Math.ceil((0.75*total-attended)/(1-0.75));

        statusCell.innerText="Attend next "+need+" classes";
        statusCell.className="bad";

        }

        });

        }

    </script>

    </body>
</html>
