<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Periodic Table of Elements</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
</head>
<body>

  <header>
    <h1>⚛ <center>Periodic Table</center> </h1>
    
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search element, symbol, or atomic number..." />
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="alkali-metal">Alkali Metals</button>
      <button class="filter-btn" data-filter="alkaline-earth">Alkaline Earth</button>
      <button class="filter-btn" data-filter="transition-metal">Transition Metals</button>
      <button class="filter-btn" data-filter="post-transition">Post-Transition</button>
      <button class="filter-btn" data-filter="metalloid">Metalloids</button>
      <button class="filter-btn" data-filter="nonmetal">Nonmetals</button>
      <button class="filter-btn" data-filter="halogen">Halogens</button>
      <button class="filter-btn" data-filter="noble-gas">Noble Gases</button>
      <button class="filter-btn" data-filter="lanthanide">Lanthanides</button>
      <button class="filter-btn" data-filter="actinide">Actinides</button>
    </div>
  </div>

  <div class="table-wrapper">
    <div class="periodic-grid" id="periodicGrid"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot alkali-metal"></span>Alkali Metal</div>
    <div class="legend-item"><span class="dot alkaline-earth"></span>Alkaline Earth</div>
    <div class="legend-item"><span class="dot transition-metal"></span>Transition Metal</div>
    <div class="legend-item"><span class="dot post-transition"></span>Post-Transition</div>
    <div class="legend-item"><span class="dot metalloid"></span>Metalloid</div>
    <div class="legend-item"><span class="dot nonmetal"></span>Nonmetal</div>
    <div class="legend-item"><span class="dot halogen"></span>Halogen</div>
    <div class="legend-item"><span class="dot noble-gas"></span>Noble Gas</div>
    <div class="legend-item"><span class="dot lanthanide"></span>Lanthanide</div>
    <div class="legend-item"><span class="dot actinide"></span>Actinide</div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-header">
        <div class="modal-number" id="modalNumber"></div>
        <div class="modal-symbol" id="modalSymbol"></div>
        <div class="modal-name" id="modalName"></div>
      </div>
      <div class="modal-body">
        <div class="modal-row"><span>Category</span><strong id="modalCategory"></strong></div>
        <div class="modal-row"><span>Atomic Mass</span><strong id="modalMass"></strong></div>
        <div class="modal-row"><span>Period</span><strong id="modalPeriod"></strong></div>
        <div class="modal-row"><span>Group</span><strong id="modalGroup"></strong></div>
        <div class="modal-row"><span>Electron Config</span><strong id="modalConfig"></strong></div>
        <div class="modal-row"><span>State at Room Temp</span><strong id="modalState"></strong></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
